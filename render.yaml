services:
  - type: web
    name: resultloop-mcp
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: PO_ENV
        value: prod
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
